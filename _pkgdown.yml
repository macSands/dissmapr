url: https://b-cubed-eu.github.io/dissmapr/
template:
  bootstrap: 5
  bslib:
    bg: '#ffffff'
    fg: '#2f2f2f'
    heading_font:
      google: PT Sans
    primary: '#005856'

navbar:
  bg: primary
  type: dark
  structure:
    left:
      - intro
      - reference
      - news
      - articles
    right:
      - search
      - mainsite
      - github
  components:
    mainsite:
      icon: fa-cube
      href: https://b-cubed.eu/
      aria-label: B-Cubed website

reference:
  - title: "Package"
    contents:
      - dissmapr

  - title: "Overview of dissmapr functions"
    desc: |
      The package consists of 10 core functions that address key steps in biodiversity data analysis, from sourcing raw occurrence and environmental data to mapping bioregions and predicting compositional turnover. It also leverages existing tools, such as the `zetadiv` package (specifically the `zetadiv::Zeta.msgdm` function) for MS-GDM, alongside widely used R libraries like `terra`, `sf`, and `ggplot2`.

  - title: "Core Functions"
    contents:
      - get_occurrence_data
      - generate_grid
      - assign_mapsheet
      - get_enviro_data
      - format_df
      - compute_orderwise
      - rm_correlated
      - predict_dissim
      - map_bioreg
      - map_bioregDiff

  - title: "ζ-MSGDM Workflow"
    desc: |
      Functions to automate a ζ-MSGDM workflow that fits, extracts and visualizes I-spline models for any set of zeta orders in just three function calls:
    contents:
      - run_ispline_models
      - plot_ispline_lines
      - plot_ispline_boxplots

  - title: "Available Metrics"
    desc: |
      Use `helper_indices` to choose a specific function for the func parameter in `compute_orderwise`, enabling the calculation of one of the following metrics:
    contents:
      - geodist_helper
      - richness
      - turnover
      - abund
      - phi_coef
      - cor_spear
      - cor_pears
      - diss_bcurt
      - orderwise_diss_gower
      - mutual_info

articles:
  - title: "All tutorials"
    navbar: "Articles"
    contents:
